name: Publish LG6851F-Pro Release

on:
  workflow_run:
    workflows:
      - Build and Release LG6851F-Pro (Strict 06 & 07 Docs)
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "成功编译的 Actions Run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: LG6851F_Pro_Signed_Firmware_${{ env.SOURCE_RUN_ID }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release_firmware

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: LG6851F-Pro-${{ env.SOURCE_RUN_ID }}
          name: LG6851F-Pro Firmware Build ${{ env.SOURCE_RUN_ID }}
          files: release_firmware/**
          generate_release_notes: true
          draft: false
          prerelease: false
