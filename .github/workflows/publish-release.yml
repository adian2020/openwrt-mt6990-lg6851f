
name: Publish LG6851F-Pro Release

on:
  workflow_run:
    workflows:
      - LG6851F MT6990 Cloud Build
    types:
      - completed

  workflow_dispatch:
    inputs:
      run_id:
        description: "成功编译的 Actions Run ID"
        required: true
        type: string

concurrency:
  group: lg6851f-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

env:
  GH_REPO: ${{ github.repository }}
  SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.event.inputs.run_id }}

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Verify successful source build and prepare release notes
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > source-run.json
          jq -e '.status == "completed" and .conclusion == "success" and .head_branch == "cloud-build" and .path == ".github/workflows/lg6851f-cloud-build.yml"' source-run.json > /dev/null
          source_sha=$(jq -r .head_sha source-run.json)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          # Prefer a reviewed per-build summary, including builds already running.
          # The override is keyed by the exact source SHA, never the branch tip's notes.
          # Read Markdown as data. Never run code from a workflow_run artifact.
          if gh api "repos/$GITHUB_REPOSITORY/contents/docs/releases/$source_sha.md?ref=cloud-build" > notes.json; then
            jq -r .content notes.json | base64 -d > RELEASE_NOTES.md
          else
            gh api "repos/$GITHUB_REPOSITORY/contents/RELEASE_NOTES.md?ref=$source_sha" > notes.json
            jq -r .content notes.json | base64 -d > RELEASE_NOTES.md
          fi
          test -s RELEASE_NOTES.md
          {
            printf '[固件更新历史](https://github.com/%s/blob/cloud-build/docs/FIRMWARE_HISTORY.md)\n\n' "$GITHUB_REPOSITORY"
            cat RELEASE_NOTES.md
          } > release-notes-with-history.md
          mv release-notes-with-history.md RELEASE_NOTES.md
          {
            printf '\n## 构建信息\n\n'
            printf -- '- 源码分支：`cloud-build`\n'
            printf -- '- 源码提交：[ %s ](https://github.com/%s/commit/%s)\n' "$source_sha" "$GITHUB_REPOSITORY" "$source_sha"
            printf -- '- 编译记录：https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID"
          } >> RELEASE_NOTES.md

      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release_firmware

      - name: Prepare A and B slot packages
        run: |
          set -e

          echo "===== Check source folders ====="

          A_SOURCE="release_firmware/A槽单刷boot和rootfs签名成功包"
          B_SOURCE="release_firmware/B槽单刷boot和rootfs签名成功包"
          BIN_SOURCE="release_firmware/bin/targets/mediatek/mt6990"

          A_SYSUPGRADE="lg6851f-mt6990-a-signed-sysupgrade.tar.gz"
          B_SYSUPGRADE="lg6851f-mt6990-b-signed-sysupgrade.tar.gz"

          test -d "$A_SOURCE"
          test -d "$B_SOURCE"
          test -f "$BIN_SOURCE/$A_SYSUPGRADE"
          test -f "$BIN_SOURCE/$B_SYSUPGRADE"

          A_FOLDER="A槽单刷boot和rootfs签名成功包"
          B_FOLDER="B槽单刷boot和rootfs签名成功包"

          A_ZIP="A槽单刷文件和网页升级包.zip"
          B_ZIP="B槽单刷文件和网页升级包.zip"

          mkdir -p release_packages/A release_packages/B
          cp RELEASE_NOTES.md release_packages/A/
          cp RELEASE_NOTES.md release_packages/B/

          echo "===== Copy A slot files ====="
          mkdir -p "release_packages/A/$A_FOLDER"
          cp -a "$A_SOURCE/." "release_packages/A/$A_FOLDER/"
          cp "$BIN_SOURCE/$A_SYSUPGRADE" "release_packages/A/"

          echo "===== Copy B slot files ====="
          mkdir -p "release_packages/B/$B_FOLDER"
          cp -a "$B_SOURCE/." "release_packages/B/$B_FOLDER/"
          cp "$BIN_SOURCE/$B_SYSUPGRADE" "release_packages/B/"

          echo "===== Create A slot ZIP ====="
          cd release_packages/A
          zip -qr "$GITHUB_WORKSPACE/$A_ZIP" \
            "$A_FOLDER" "$A_SYSUPGRADE" RELEASE_NOTES.md

          echo "===== Create B slot ZIP ====="
          cd ../B
          zip -qr "$GITHUB_WORKSPACE/$B_ZIP" \
            "$B_FOLDER" "$B_SYSUPGRADE" RELEASE_NOTES.md

          echo "===== Verify ZIP contents ====="
          unzip -l "$GITHUB_WORKSPACE/$A_ZIP"
          unzip -l "$GITHUB_WORKSPACE/$B_ZIP"

          echo "===== Final release files ====="
          ls -lh "$GITHUB_WORKSPACE"/*.zip

      - name: 生成或复用固件版本号
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" | jq 'add' > version-tags.json
          existing=$(jq -r --arg sha "$SOURCE_SHA" '.[] | select(.object.type == "commit" and .object.sha == $sha) | .ref' version-tags.json | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -n "$existing" ]; then
            VERSION="$existing"
          else
            LATEST=$(jq -r '.[].ref' version-tags.json | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$LATEST" ]; then
              VERSION=v1.0.8
            else
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本：$VERSION；源码：$SOURCE_SHA"

      - name: 创建并核对源码版本标签
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" > release-tag.json; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$TAG_NAME" -f "sha=$SOURCE_SHA" > release-tag.json
          fi
          jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' release-tag.json > /dev/null

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: LG6851F-Pro ${{ steps.version.outputs.version }}（构建 ${{ env.SOURCE_RUN_ID }}）
          files: |
            A槽单刷文件和网页升级包.zip
            B槽单刷文件和网页升级包.zip
            RELEASE_NOTES.md
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Update published firmware history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['TAG_NAME']
          source = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), 'Invalid version tag'
          assert re.fullmatch(r'[0-9a-f]{40}', source), 'Invalid source SHA'

          def api(path):
              result = subprocess.run(['gh', 'api', 'repos/'+repo+'/'+path], capture_output=True, text=True)
              if result.returncode:
                  raise RuntimeError('GitHub API read failed: '+path+' '+result.stderr)
              return json.loads(result.stdout)

          release = api('releases/tags/'+tag)
          assert release['tag_name'] == tag and not release['draft'] and not release['prerelease']
          assert re.fullmatch(r'\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ', release.get('published_at') or '')
          assert release['html_url'] == 'https://github.com/'+repo+'/releases/tag/'+tag
          ref = api('git/ref/tags/'+tag)
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == source, 'Release source mismatch'
          body = release.get('body') or ''
          body = '\n'.join(line for line in body.splitlines() if not line.startswith('[固件更新历史]('))
          body = body.split('\n## 构建信息', 1)[0].strip()
          body = re.sub(r'^# 本版本更新\s*\n', '', body).strip()
          body = re.sub(r'^## ', '### ', body, flags=re.M)
          assert body, 'Published release has no update notes'
          marker = '<!-- release:'+tag+' -->'
          date = release['published_at'].replace('T', ' ').replace('Z', ' UTC')
          entry = (marker+'\n## '+tag+'\n\n发布时间：'+date+' · [查看该版 Release]('+release['html_url']+')'
                   +' · [源码 '+source[:7]+'](https://github.com/'+repo+'/commit/'+source+')\n\n'+body+'\n\n')
          path = 'contents/docs/FIRMWARE_HISTORY.md'
          for attempt in range(3):
              record = api(path+'?ref=cloud-build')
              history = base64.b64decode(record['content'], validate=False).decode('utf-8')
              if marker in history.splitlines():
                  print('History already contains '+tag+'; no changes.')
                  break
              prefix, separator, previous = history.partition('<!-- firmware-history -->')
              assert separator, 'Missing firmware history insertion marker'
              updated = prefix+separator+'\n\n'+entry+previous.lstrip('\n')
              payload = dict(message='Record firmware history for '+tag, branch='cloud-build', sha=record['sha'],
                             content=base64.b64encode(updated.encode('utf-8')).decode('ascii'))
              result = subprocess.run(['gh', 'api', '--method', 'PUT', 'repos/'+repo+'/'+path, '--input', '-'],
                                      input=json.dumps(payload), capture_output=True, text=True)
              if result.returncode == 0:
                  assert re.fullmatch(r'[0-9a-f]{40}', json.loads(result.stdout)['commit']['sha'])
                  print('Recorded '+tag+' with its actual publication time.')
                  break
              if 'HTTP 409' not in result.stderr or attempt == 2:
                  raise RuntimeError('History update failed: '+result.stderr)
              # Another writer advanced this file: re-read and preserve its changes.
          else:
              raise RuntimeError('History update retry budget exhausted')
          PY
