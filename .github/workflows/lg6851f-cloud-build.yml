
name: LG6851F MT6990 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg6851f-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show disk space
        run: |
          echo "===== Disk space before build ====="
          df -h
          echo "===== Memory ====="
          free -h
          echo "===== CPU ====="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl swig \
            python3-setuptools jq xsltproc libelf-dev xz-utils

      - name: Install Zig 0.13.0
        run: |
          set -e

          curl -sSLo /tmp/zig.tar.xz \
            "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz"

          mkdir -p "$HOME/zig"
          tar xf /tmp/zig.tar.xz -C "$HOME/zig" --strip-components=1

          echo "$HOME/zig" >> "$GITHUB_PATH"

          zig version

      - name: Download and prepare UU Game Booster
        run: |
          set -e

          echo "===== Download UU Game Booster source ====="

          git clone --depth 1 \
            https://github.com/xiaodoudou/luci-app-uugamebooster.git \
            "$RUNNER_TEMP/uuplugin-src"

          echo "===== Copy LuCI package ====="

          mkdir -p package/vendor/luci-app-uugamebooster

          cp -a \
            "$RUNNER_TEMP/uuplugin-src/luci-app-uugamebooster/." \
            package/vendor/luci-app-uugamebooster/

          echo "===== Build architecture filters ====="

          sh "$RUNNER_TEMP/uuplugin-src/tools/build-preload.sh" \
            package/vendor/luci-app-uugamebooster/root/usr/lib/uuplugin

          echo "===== Verify ARM64 filter ====="

          test -s \
            package/vendor/luci-app-uugamebooster/root/usr/lib/uuplugin/uu-view-preload-aarch64.so

          ls -lh package/vendor/luci-app-uugamebooster/root/usr/lib/uuplugin/

          echo "UU Game Booster preparation completed."

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate configuration
        run: |
          set -e

          echo "===== Enable UU Game Booster ====="
          echo "CONFIG_PACKAGE_luci-app-uugamebooster=y" >> .config

          make defconfig

          echo "===== Verify UU Game Booster configuration ====="
          grep -n '^CONFIG_PACKAGE_luci-app-uugamebooster=y$' .config

      - name: Build and verify LG6851F images
        run: |
          ./scripts/mt6990-build-and-record.sh

      - name: Show output files
        if: success()
        run: |
          echo "===== Target output ====="
          ls -lah bin/targets/mediatek/mt6990/
          echo "===== A slot signed images ====="
          ls -lah "A槽单刷boot和rootfs签名成功包/"
          echo "===== B slot signed images ====="
          ls -lah "B槽单刷boot和rootfs签名成功包/"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          path: |
            bin/targets/mediatek/mt6990/
            A槽单刷boot和rootfs签名成功包/
            B槽单刷boot和rootfs签名成功包/
          if-no-files-found: error
          retention-days: 14
