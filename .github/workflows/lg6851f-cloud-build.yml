
name: LG6851F MT6990 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lg6851f-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: cloud-build

      - name: Show disk space
        run: |
          echo "===== Disk space before build ====="
          df -h
          echo "===== Memory ====="
          free -h
          echo "===== CPU ====="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl swig \
            python3-setuptools jq xsltproc libelf-dev

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update feeds
        run: |
          # feeds update refreshes .config before feed packages are installed.
          # Preserve the checked-in selections until all recipes are available.
          cp .config "$RUNNER_TEMP/lg6851f.config"
          ./scripts/feeds update -a

      - name: Prepare OpenClash and optional Nikki packages
        run: |
          python3 scripts/tests/test_mt6990_prepare_proxy.py
          ./scripts/mt6990-prepare-proxy.sh
          ./scripts/feeds install -a

      - name: 检查升级迁移、开机射频与蜂窝分组
        run: |
          python3 scripts/tests/test_lg6851f_upgrade_state.py
          python3 scripts/tests/test_lg6851f_radio.py
          python3 scripts/tests/test_lg6851f_radio_control.py
          python3 scripts/tests/test_lg6851f_radio_setup.py
          python3 scripts/tests/test_lg6851f_network_defaults.py
          python3 scripts/tests/test_lg6851f_apk_feed.py
          python3 scripts/tests/test_lg6851f_radio_details.py
          python3 scripts/tests/test_lg6851f_band_verify.py
          python3 scripts/tests/test_lg6851f_lock_transaction.py
          python3 scripts/tests/test_lg6851f_sms_send.py
          python3 scripts/tests/test_lg6851f_wifi_start.py
          python3 scripts/tests/test_lg6851f_boot_recovery.py
          python3 scripts/tests/test_lg6851f_autoreboot.py
          python3 scripts/tests/test_lg6851f_fair_qos.py
          python3 scripts/lg6851f-check-cpe-package.py

      - name: Generate and verify configuration
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lg6851f.config" .config
          mkdir -p files/etc/apk/repositories.d
          git rev-parse HEAD > files/etc/mt6990-firmware-id
          printf '%s\n' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/nikki-apk/${GITHUB_SHA}/packages.adb" > files/etc/apk/repositories.d/nikki.list
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq 'recursive dependency detected|error:' defconfig.log; then
            echo "[ERROR] Kconfig generation failed"
            exit 1
          fi
          for p in luci-app-filemanager luci-i18n-filemanager-zh-cn luci-app-uugamebooster luci-i18n-uugamebooster-zh-cn luci-app-5gmodem luci-i18n-5gmodem-zh-cn lg6851f-modem-chain-only audio-support openssh-sftp-server luci-app-openclash mihomo-openclash-core luci-theme-aurora luci-app-aurora-config luci-i18n-aurora-config-zh-cn luci-app-autoreboot luci-i18n-autoreboot-zh-cn flock rpcd-mod-ucode rpcd-mod-iwinfo ucode-mod-fs ucode-mod-uci ucode-mod-ubus ucode-mod-uloop curl ca-bundle coreutils-sha256sum; do
            grep -qx "CONFIG_PACKAGE_${p}=y" .config || {
              echo "[ERROR] $p is not enabled after defconfig"
              exit 1
            }
          done
          grep -qx 'CONFIG_LIBCURL_SMTP=y' .config || { echo '[ERROR] SMTP support is missing'; exit 1; }
          grep -qx 'CONFIG_LIBCURL_HTTP=y' .config || { echo '[ERROR] HTTP support is missing'; exit 1; }
          if grep -qx 'CONFIG_LIBCURL_NOSSL=y' .config; then
            echo '[ERROR] TLS support is required for SMS forwarding'
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-i18n-nikki-zh-cn|mihomo-meta|luci-theme-vantage|luci-app-vantage)=y$|^CONFIG_PACKAGE_mihomo-alpha=[ym]$' .config; then
            echo "[ERROR] An unwanted proxy package is enabled"
            exit 1
          fi

      - name: Build and verify LG6851F images
        run: |
          ./scripts/mt6990-build-and-record.sh

      - name: Publish firmware-matched Nikki APK feed
        env:
          BUILD_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          feed="bin/packages/aarch64_cortex-a55_neon-vfpv4/nikki"
          test -s "$feed/packages.adb"
          for p in nikki luci-app-nikki luci-i18n-nikki-zh-cn mihomo-meta; do
            compgen -G "$feed/${p}-*.apk" > /dev/null
          done
          publish="$RUNNER_TEMP/nikki-apk-publish"
          git fetch origin refs/heads/nikki-apk:refs/remotes/origin/nikki-apk || true
          if git show-ref --verify --quiet refs/remotes/origin/nikki-apk; then
            git worktree add "$publish" origin/nikki-apk
          else
            git worktree add --detach "$publish" HEAD
            git -C "$publish" checkout --orphan nikki-feed
            git -C "$publish" rm -rf --quiet .
          fi
          mkdir -p "$publish/$BUILD_SOURCE_SHA"
          cp "$feed"/*.apk "$feed/packages.adb" "$publish/$BUILD_SOURCE_SHA/"
          git -C "$publish" config user.name github-actions[bot]
          git -C "$publish" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish" add "$BUILD_SOURCE_SHA"
          git -C "$publish" commit -m "发布与源码 $BUILD_SOURCE_SHA 匹配的 Nikki 软件包"
          git -C "$publish" push origin HEAD:nikki-apk

      - name: Show output files
        if: success()
        run: |
          echo "===== Target output ====="
          ls -lah bin/targets/mediatek/mt6990/
          echo "===== A slot signed images ====="
          ls -lah "A槽单刷boot和rootfs签名成功包/"
          echo "===== B slot signed images ====="
          ls -lah "B槽单刷boot和rootfs签名成功包/"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-build-diagnostics
          include-hidden-files: true
          path: |
            defconfig.log
            .config
            tmp/.config-package.in
            logs/
          retention-days: 7

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          path: |
            bin/targets/mediatek/mt6990/
            A槽单刷boot和rootfs签名成功包/
            B槽单刷boot和rootfs签名成功包/
          if-no-files-found: error
          retention-days: 14
