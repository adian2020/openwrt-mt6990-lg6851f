
name: LG6851F MT6990 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg6851f-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: cloud-build

      - name: Show disk space
        run: |
          echo "===== Disk space before build ====="
          df -h
          echo "===== Memory ====="
          free -h
          echo "===== CPU ====="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl swig \
            python3-setuptools jq xsltproc libelf-dev

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update feeds
        run: |
          # feeds update refreshes .config before feed packages are installed.
          # Preserve the checked-in selections until all recipes are available.
          cp .config "$RUNNER_TEMP/lg6851f.config"
          ./scripts/feeds update -a

      - name: Select Nikki with Mihomo Alpha
        run: |
          ./scripts/mt6990-prepare-proxy.sh
          ./scripts/feeds install -a

      - name: Generate and verify configuration
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lg6851f.config" .config
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq 'recursive dependency detected|error:' defconfig.log; then
            echo "[ERROR] Kconfig generation failed"
            exit 1
          fi
          for p in nikki luci-app-nikki mihomo-alpha luci-theme-vantage luci-app-vantage luci-i18n-nikki-zh-cn luci-i18n-vantage-zh-cn luci-i18n-vantage-theme-zh-cn; do
            grep -qx "CONFIG_PACKAGE_${p}=y" .config || {
              echo "[ERROR] $p is not enabled after defconfig"
              exit 1
            }
          done
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-openclash|mihomo-openclash-core|mihomo-meta)=[ym]$' .config; then
            echo "[ERROR] An unwanted proxy package is enabled"
            exit 1
          fi

      - name: Build and verify LG6851F images
        run: |
          ./scripts/mt6990-build-and-record.sh

      - name: Show output files
        if: success()
        run: |
          echo "===== Target output ====="
          ls -lah bin/targets/mediatek/mt6990/
          echo "===== A slot signed images ====="
          ls -lah "A槽单刷boot和rootfs签名成功包/"
          echo "===== B slot signed images ====="
          ls -lah "B槽单刷boot和rootfs签名成功包/"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-build-diagnostics
          include-hidden-files: true
          path: |
            defconfig.log
            .config
            tmp/.config-package.in
            logs/
          retention-days: 7

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          path: |
            bin/targets/mediatek/mt6990/
            A槽单刷boot和rootfs签名成功包/
            B槽单刷boot和rootfs签名成功包/
          if-no-files-found: error
          retention-days: 14
