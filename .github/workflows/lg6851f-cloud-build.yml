
name: LG6851F MT6990 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lg6851f-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: cloud-build

      - name: Show disk space
        run: |
          echo "===== Disk space before build ====="
          df -h
          echo "===== Memory ====="
          free -h
          echo "===== CPU ====="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl swig \
            python3-setuptools jq xsltproc libelf-dev

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Diagnose Kconfig recursive dependencies
        run: |
          echo "===== Feed directories ====="
          ls -lah package/feeds/

          echo "===== Generated package config references ====="
          for p in libsdl2-image libsdl3-image sdl3-doom libsdl2-compat wpewebkit-driver wpewebkit-minibrowser openappid libgtk-demos libgtk-utils qt5graphicaleffects qt5quick-controls2 qt5svg qt5script-examples qt5script-scriptTools mihomo-alpha mihomo-meta; do
            echo "===== $p ====="
            grep -RInE "DEPENDS.*${p}|${p}.*DEPENDS" package/feeds/ feeds/ package/ 2>/dev/null | head -30 || true
          done

          echo "===== Nikki and Vantage package files ====="
          find package/feeds -type f \( -path '*nikki*Makefile' -o -path '*vantage*Makefile' \) -print

      - name: Generate configuration and inspect Kconfig
        run: |
          echo "===== Before defconfig ====="
          grep -E '^(CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-theme-vantage|luci-app-vantage|luci-i18n-nikki-zh-cn|luci-i18n-vantage-zh-cn|luci-i18n-vantage-theme-zh-cn|mihomo-meta)=y|# CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-theme-vantage|luci-app-vantage|luci-i18n-nikki-zh-cn|luci-i18n-vantage-zh-cn|luci-i18n-vantage-theme-zh-cn|mihomo-meta) is not set)' .config || true

          make defconfig || true

          echo "===== Kconfig context: Mihomo circular dependency ====="
          if [ -f tmp/.config-package.in ]; then
            sed -n '129815,129845p' tmp/.config-package.in
          else
            echo "[ERROR] tmp/.config-package.in not found"
          fi

          echo "===== Kconfig context: SDL / WPE / GTK ====="
          sed -n '64200,64285p' tmp/.config-package.in 2>/dev/null || true
          sed -n '66340,66390p' tmp/.config-package.in 2>/dev/null || true
          sed -n '107885,107910p' tmp/.config-package.in 2>/dev/null || true

          echo "===== Kconfig context: SDL3 / GTK / Qt ====="
          sed -n '138370,138425p' tmp/.config-package.in 2>/dev/null || true
          sed -n '151040,151335p' tmp/.config-package.in 2>/dev/null || true

          echo "===== Locate original Mihomo package definitions ====="
          grep -RInE 'mihomo-alpha|mihomo-meta' feeds package/feeds package 2>/dev/null | head -100 || true

          echo "===== Locate original SDL / Qt / GTK package definitions ====="
          grep -RInE 'libsdl2-image|libsdl3-image|qt5script-examples|qt5svg|libgtk-demos|wpewebkit-driver' feeds package/feeds package 2>/dev/null | head -100 || true

          echo "===== After defconfig ====="
          grep -E '^(CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-theme-vantage|luci-app-vantage|luci-i18n-nikki-zh-cn|luci-i18n-vantage-zh-cn|luci-i18n-vantage-theme-zh-cn|mihomo-meta)=y|# CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-theme-vantage|luci-app-vantage|luci-i18n-nikki-zh-cn|luci-i18n-vantage-zh-cn|luci-i18n-vantage-theme-zh-cn|mihomo-meta) is not set)' .config || true

          for p in nikki luci-app-nikki luci-theme-vantage luci-app-vantage; do
            if grep -qx "CONFIG_PACKAGE_${p}=y" .config; then
              echo "[OK] $p is enabled"
            else
              echo "[ERROR] $p is not enabled after defconfig"
              exit 1
            fi
          done

      - name: Build and verify LG6851F images
        run: |
          ./scripts/mt6990-build-and-record.sh

      - name: Show output files
        if: success()
        run: |
          echo "===== Target output ====="
          ls -lah bin/targets/mediatek/mt6990/
          echo "===== A slot signed images ====="
          ls -lah "A槽单刷boot和rootfs签名成功包/"
          echo "===== B slot signed images ====="
          ls -lah "B槽单刷boot和rootfs签名成功包/"

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          path: |
            bin/targets/mediatek/mt6990/
            A槽单刷boot和rootfs签名成功包/
            B槽单刷boot和rootfs签名成功包/
          if-no-files-found: error
          retention-days: 14
