
name: LG6851F MT6990 Cloud Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lg6851f-cloud-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Show disk space
        run: |
          echo "===== Disk space before build ====="
          df -h
          echo "===== Memory ====="
          free -h
          echo "===== CPU ====="
          nproc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils \
            rsync unzip zlib1g-dev file wget curl swig \
            python3-setuptools jq xsltproc libelf-dev libmd-dev

      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: openwrt-dl-${{ runner.os }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            openwrt-dl-${{ runner.os }}-

      - name: Update feeds
        run: |
          # feeds update refreshes .config before feed packages are installed.
          # Preserve the checked-in selections until all recipes are available.
          cp .config "$RUNNER_TEMP/lg6851f.config"
          ./scripts/feeds update -a

      - name: Refresh installed plugins to latest upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/tests/test_mt6990_update_plugins.py
          python3 scripts/mt6990-update-plugins.py

      - name: Prepare OpenClash and optional Nikki packages
        run: |
          python3 scripts/tests/test_mt6990_prepare_proxy.py
          ./scripts/mt6990-prepare-proxy.sh
          ./scripts/feeds install -a

      - name: 检查升级迁移、开机射频与蜂窝分组
        run: |
          python3 scripts/tests/test_lg6851f_upgrade_state.py
          python3 scripts/tests/test_lg6851f_radio.py
          python3 scripts/tests/test_lg6851f_radio_control.py
          python3 scripts/tests/test_lg6851f_radio_setup.py
          python3 scripts/tests/test_lg6851f_network_defaults.py
          python3 scripts/tests/test_lg6851f_apk_feed.py
          python3 scripts/tests/test_lg6851f_radio_details.py
          python3 scripts/tests/test_lg6851f_mode_ims_probe.py
          python3 scripts/tests/test_lg6851f_band_verify.py
          python3 scripts/tests/test_lg6851f_lock_transaction.py
          python3 scripts/tests/test_lg6851f_sms_send.py
          python3 scripts/tests/test_lg6851f_sms_list.py
          python3 scripts/tests/test_lg6851f_ab_archive.py
          python3 scripts/tests/test_lg6851f_wifi_start.py
          python3 scripts/tests/test_lg6851f_procd_trace.py
          python3 scripts/tests/test_lg6851f_boot_measure.py
          python3 scripts/tests/test_lg6851f_boot_recovery.py
          python3 scripts/tests/test_lg6851f_autoreboot.py
          python3 scripts/tests/test_lg6851f_fair_qos.py
          python3 scripts/tests/test_mt6990_apk_library.py
          python3 scripts/lg6851f-check-cpe-package.py

      - name: Generate and verify configuration
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/lg6851f.config" .config
          python3 scripts/mt6990-apk-library.py select
          python3 scripts/mt6990-apk-library.py prepare --repository "$GITHUB_REPOSITORY" --snapshot "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source "$GITHUB_SHA"
          git rev-parse HEAD > files/etc/mt6990-firmware-id
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq 'recursive dependency detected|error:' defconfig.log; then
            echo "[ERROR] Kconfig generation failed"
            exit 1
          fi
          python3 scripts/mt6990-apk-library.py verify-selection
          for p in luci-app-upnp luci-i18n-upnp-zh-cn miniupnpd-nftables luci-app-filemanager luci-i18n-filemanager-zh-cn luci-app-uugamebooster luci-i18n-uugamebooster-zh-cn luci-app-5gmodem luci-i18n-5gmodem-zh-cn lg6851f-modem-chain-only audio-support openssh-sftp-server luci-app-openclash mihomo-openclash-core luci-theme-aurora luci-app-aurora-config luci-i18n-aurora-config-zh-cn luci-app-autoreboot luci-i18n-autoreboot-zh-cn flock rpcd-mod-ucode rpcd-mod-iwinfo ucode-mod-fs ucode-mod-digest ucode-mod-uci ucode-mod-ubus ucode-mod-uloop curl ca-bundle coreutils-sha256sum; do
            grep -qx "CONFIG_PACKAGE_${p}=y" .config || {
              echo "[ERROR] $p is not enabled after defconfig"
              exit 1
            }
          done
          grep -qx 'CONFIG_LIBCURL_SMTP=y' .config || { echo '[ERROR] SMTP support is missing'; exit 1; }
          grep -qx 'CONFIG_LIBCURL_HTTP=y' .config || { echo '[ERROR] HTTP support is missing'; exit 1; }
          if grep -qx 'CONFIG_LIBCURL_NOSSL=y' .config; then
            echo '[ERROR] TLS support is required for SMS forwarding'
            exit 1
          fi
          if grep -Eq '^CONFIG_PACKAGE_(nikki|luci-app-nikki|luci-i18n-nikki-zh-cn|mihomo-meta|luci-theme-vantage|luci-app-vantage)=y$|^CONFIG_PACKAGE_mihomo-alpha=[ym]$' .config; then
            echo "[ERROR] An unwanted proxy package is enabled"
            exit 1
          fi

      - name: Build and verify LG6851F images
        run: |
          ./scripts/mt6990-build-and-record.sh

      - name: Verify and publish firmware-matched APK library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/mt6990-build-apk-repository.sh
          python3 scripts/mt6990-publish-apk-library.py

      - name: Show output files
        if: success()
        run: |
          test -s files/etc/mt6990-plugin-versions.json
          cp files/etc/mt6990-plugin-versions.json "A槽单刷boot和rootfs签名成功包/PLUGIN_VERSIONS.json"
          cp files/etc/mt6990-plugin-versions.json "B槽单刷boot和rootfs签名成功包/PLUGIN_VERSIONS.json"
          cp bin/mt6990-apk-repository/repository.manifest.json "A槽单刷boot和rootfs签名成功包/APK_LIBRARY.json"
          cp bin/mt6990-apk-repository/repository.manifest.json "B槽单刷boot和rootfs签名成功包/APK_LIBRARY.json"
          echo "===== Target output ====="
          ls -lah bin/targets/mediatek/mt6990/
          echo "===== A slot signed images ====="
          ls -lah "A槽单刷boot和rootfs签名成功包/"
          echo "===== B slot signed images ====="
          ls -lah "B槽单刷boot和rootfs签名成功包/"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-build-diagnostics
          include-hidden-files: true
          path: |
            defconfig.log
            .config
            tmp/.config-package.in
            logs/
            files/usr/share/mt6990-apk/
            bin/mt6990-apk-repository/repository.manifest.json
            bin/mt6990-apk-validation/packages.adb
            bin/mt6990-apk-validation/public-key.pem
            bin/mt6990-apk-validation/firmware.world
            bin/mt6990-apk-validation/validation.json
          retention-days: 7

      - name: Upload APK library metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-APK-Library-Metadata
          path: |
            bin/mt6990-apk-repository/repository.manifest.json
            bin/mt6990-apk-repository/firmware.world
            bin/mt6990-apk-repository/build.json
            bin/mt6990-apk-repository/selection.json
            bin/mt6990-apk-repository/PLUGIN_VERSIONS.json
            bin/mt6990-apk-repository/SHA256SUMS
            bin/mt6990-apk-repository/public-key.pem
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-MT6990-Firmware
          path: |
            bin/targets/mediatek/mt6990/
            A槽单刷boot和rootfs签名成功包/
            B槽单刷boot和rootfs签名成功包/
          if-no-files-found: error
          retention-days: 14
