name: LG6851F Pro Experimental Image

on:
  push:
    branches: [cloud-build-stock-accel-port]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lg6851f-pro-wireless-abi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wireless-abi:
    if: github.ref == 'refs/heads/cloud-build-stock-accel-port'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      PRO_BUILD_REVISION: b942f071af127ece3d40321aca41f4f96f2ab800
      JOBS: '4'
      LG6851F_PRO_WARP_IMAGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: adian2020/LG6851F-Pro
          ref: ${{ env.PRO_BUILD_REVISION }}
          fetch-depth: 0
          path: pro-source
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gcc-multilib gawk gettext \
            git libncurses-dev libssl-dev python3 python3-distutils python3-setuptools \
            rsync unzip zlib1g-dev file wget curl swig jq xsltproc libelf-dev libmd-dev \
            python3.10-venv device-tree-compiler squashfs-tools
          python3.10 -m venv "$RUNNER_TEMP/lg6851f-sign"
          "$RUNNER_TEMP/lg6851f-sign/bin/pip" install pycryptodome pyasn1 cryptography
          cd lg6851f_sign_tool/fg370-2305-opensdk/mtk/tools/common/security/tool
          "$RUNNER_TEMP/lg6851f-sign/bin/python3.10" -B -c 'import sign_flow'

      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: lg6851f-pro-wireless-dl-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lg6851f-pro-wireless-dl-${{ runner.os }}-
            openwrt-dl-${{ runner.os }}-

      - name: Prepare target build configuration
        run: |
          set -euo pipefail
          python3 scripts/tests/test_lg6851f_pro_network_diag.py
          cp .config "$RUNNER_TEMP/lg6851f.config"
          ./scripts/feeds update -a
          cp "$RUNNER_TEMP/lg6851f.config" .config
          if grep -Eq '^CONFIG_PACKAGE_mihomo-alpha=[ym]$' .config; then
            echo 'ERROR: mihomo-alpha needs a Kconfig compatibility fix before enabling'
            exit 1
          fi
          ./scripts/mt6990-prepare-proxy.sh
          ./scripts/feeds install -a
          cp "$RUNNER_TEMP/lg6851f.config" .config
          sed -i -E 's/^(CONFIG_PACKAGE_kmod-mt(76|79)[^=]*)=[ym]$/# \1 is not set/' .config
          sed -i -E 's/^(CONFIG_PACKAGE_wpad-basic-mbedtls)=[ym]$/# \1 is not set/' .config
          for package in kmod-mt6990-hwnat kmod-sched kmod-tcp-bbr libnl-core libnl-genl libopenssl wpad-mbedtls; do
            sed -i -e "/^CONFIG_PACKAGE_${package}=/d" -e "/^# CONFIG_PACKAGE_${package} is not set$/d" .config
            printf 'CONFIG_PACKAGE_%s=y\n' "$package" >> .config
          done
          python3 scripts/mt6990-apk-library.py select
          python3 scripts/mt6990-apk-library.py prepare \
            --repository "$GITHUB_REPOSITORY" --snapshot "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --source "$GITHUB_SHA"
          python3 scripts/mt6990-update-plugins.py --report-only
          make defconfig 2>&1 | tee defconfig.log
          if grep -Eq 'recursive dependency detected|error:' defconfig.log; then exit 1; fi
          python3 scripts/mt6990-apk-library.py verify-selection
          grep -qx 'CONFIG_TARGET_mediatek_mt6990_DEVICE_fiberhome_lg6851f=y' .config
          if grep -Eq '^CONFIG_PACKAGE_kmod-mt(76|79)[^=]*=y$' .config; then
            echo 'The vendor image must have exclusive ownership of the Wi-Fi hardware'
            exit 1
          fi
          printf '%s\n' "$GITHUB_SHA" > files/etc/mt6990-firmware-id
          for package in kmod-cfg80211 kmod-mac80211 kmod-mt6990-hwnat libnl-core libnl-genl libopenssl libubox libubus libjson-c liblua wpad-mbedtls; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          for package in luci-mod-network luci-app-firewall rpcd-mod-iwinfo kmod-nf-nat kmod-lg6851f-ppe-stats kmod-sched kmod-sched-cake kmod-tcp-bbr; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config
          done
          scan_patch=package/network/utils/iwinfo/patches/900-lg6851f-vendor618-scan.patch
          cmp package/network/utils/iwinfo/Makefile "pro-source/package/network/utils/iwinfo/Makefile"
          cp "pro-source/$scan_patch" "$scan_patch"
          for package in nikki luci-app-nikki luci-i18n-nikki-zh-cn mihomo-meta luci-app-openclash mihomo-openclash-core; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || { echo "Missing Pro service package $package"; exit 1; }
          done

      - name: Build kernel and exports with the target toolchain
        run: |
          set -euo pipefail
          make -j"$JOBS" V=s tools/install
          make -j"$JOBS" V=s toolchain/install
          make -j"$JOBS" V=s package/system/apk/host/compile
          make -j"$JOBS" V=s target/linux/prepare
          shopt -s nullglob
          kernels=(build_dir/target-*/linux-mediatek_mt6990/linux-6.18.44)
          test "${#kernels[@]}" -eq 1
          nat_dir="${kernels[0]}/net/netfilter"
          nat_sources=(nf_nat_core.c nf_nat_helper.c nf_nat_masquerade.c nf_nat_proto.c nf_nat_redirect.c nf_internals.h)
          : > "$RUNNER_TEMP/pro-nat-sources.sha256"
          for source in "${nat_sources[@]}"; do
            test -f "$nat_dir/$source"
            git -C pro-source show "$PRO_BUILD_REVISION:development-history/V2.10/nf-nat/$source" > "$nat_dir/$source"
            test -s "$nat_dir/$source"
            sha256sum "$nat_dir/$source" >> "$RUNNER_TEMP/pro-nat-sources.sha256"
          done
          make -j"$JOBS" V=s target/linux/compile
          sha256sum -c "$RUNNER_TEMP/pro-nat-sources.sha256"
          readelf -SW "$nat_dir/nf_nat.ko" | grep -E ' __param +PROGBITS '
          readelf -p .rodata "$nat_dir/nf_nat.ko" | grep -E ' lg6851f_nat_mode$'
          make -j"$JOBS" V=s package/kernel/mac80211/compile
          make -j"$JOBS" V=s package/vendor/mt6990-hwnat/compile

      - name: Build target hostapd libraries
        run: |
          make -j"$JOBS" V=s package/libs/libjson-c/compile
          make -j"$JOBS" V=s package/utils/lua/compile
          make -j"$JOBS" V=s package/libs/libubox/compile
          make -j"$JOBS" V=s package/system/ubus/compile
          make -j"$JOBS" V=s package/libs/libnl/compile
          if grep -qx 'CONFIG_OPENSSL_WITH_COMPRESSION=y' .config; then
            make -j"$JOBS" V=s package/libs/zlib/compile
          fi
          make -j"$JOBS" V=s package/libs/openssl/compile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the vendor wireless modules and build hostapd
        run: |
          set -euo pipefail
          shopt -s nullglob
          kernels=(build_dir/target-*/linux-mediatek_mt6990/linux-6.18.44)
          compilers=(staging_dir/toolchain-aarch64_cortex-a55*/bin/aarch64-openwrt-linux-musl-gcc)
          staging=(staging_dir/target-aarch64_cortex-a55*)
          test "${#kernels[@]}" -eq 1 && test "${#compilers[@]}" -eq 1 && test "${#staging[@]}" -eq 1
          compiler="$PWD/${compilers[0]}"
          python3 scripts/lg6851f-build-pro-wireless.py \
            --vendor-repo pro-source --kernel "${kernels[0]}" --staging "${staging[0]}" \
            --cross-compile "${compiler%gcc}" --work-dir build-pro-wireless -j "$JOBS" \
            --hostapd --image-overlay files
          mkdir pro-wireless-verified
          cp build-pro-wireless/{pro-warp.dtb,driver-repair.json,lg6851f-hostapd} pro-wireless-verified/
          kernel="${kernels[0]}"
          test -s "$kernel/arch/arm64/boot/Image"
          test -s "$kernel/.config"
          cp "$kernel/arch/arm64/boot/Image" pro-wireless-verified/Image
          cp "$kernel/.config" pro-wireless-verified/kernel.config
          for name in wifi_md_coex mt_wifi_cmn mtk_warp mt_wifi mtk_hwifi connac_if mtk_pci mtk_wed mt7990 mt7991; do
            mapfile -t matches < <(find build-pro-wireless/vendor-source -type f -name "$name.ko")
            test "${#matches[@]}" -eq 1
            "${compiler%gcc}strip" --strip-debug "${matches[0]}" -o "pro-wireless-verified/$name.ko"
          done
          printf 'source=%s\npro_build_source=%s\n' "$GITHUB_SHA" "$PRO_BUILD_REVISION" > pro-wireless-verified/build-id.txt
          sha256sum "$kernel/Module.symvers" "${kernel%/*}/symvers/mac80211.symvers" \
            "${kernel%/*}/symvers/mt6990-hwnat.symvers" >> pro-wireless-verified/build-id.txt
          cd pro-wireless-verified
          sha256sum *.ko Image kernel.config pro-warp.dtb driver-repair.json lg6851f-hostapd build-id.txt > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Assemble and sign the experimental A and B images
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/lg6851f-sign/bin:$PATH"
          ./scripts/mt6990-build-and-record.sh -j"$JOBS" V=s
          sha256sum -c "$RUNNER_TEMP/pro-nat-sources.sha256"
          shopt -s nullglob
          roots=(build_dir/target-*/root-mediatek)
          kdirs=(build_dir/target-*/linux-mediatek_mt6990)
          test "${#roots[@]}" -eq 1 && test "${#kdirs[@]}" -eq 1
          kdir="${kdirs[0]}"
          cmp "$kdir/Image" pro-wireless-verified/Image
          tail -n +3 pro-wireless-verified/build-id.txt | sha256sum -c -
          dtb="$kdir/image-mt6990-fiberhome-lg6851f-pro-warp.dtb"
          test "$(fdtget "$dtb" /wed@15010000 compatible)" = mediatek,wed
          test "$(fdtget "$dtb" /wed2@15011000 compatible)" = mediatek,wed2
          if fdtget "$dtb" /ethernet@15100000 mediatek,wed >/dev/null 2>&1; then exit 1; fi
          if [ -n "$(find "${roots[0]}/lib/modules" \( -name 'mt76*.ko*' -o -name 'mt79*.ko*' \) -print -quit)" ]; then
            echo 'Unexpected mt76 module in the vendor rootfs'
            exit 1
          fi
          rootfs="$kdir/root.squashfs"
          for module in pro-wireless-verified/*.ko; do
            unsquashfs -cat "$rootfs" "usr/lib/lg6851f-vendor618/modules/${module##*/}" | cmp - "$module"
          done
          unsquashfs -cat "$rootfs" usr/sbin/lg6851f-hostapd | cmp - pro-wireless-verified/lg6851f-hostapd
          for runtime in etc/config/wireless etc/init.d/lg6851f-vendor618-prepare \
                         etc/init.d/lg6851f-pro-network-diag usr/sbin/lg6851f-pro-network-diag \
                         usr/sbin/lg6851f-vendor618-start usr/sbin/lg6851f-prepare-vendor-wireless \
                         lib/netifd/wireless/vendor618.sh; do
            unsquashfs -cat "$rootfs" "$runtime" | cmp - "files/$runtime"
          done
          unsquashfs -ll "$rootfs" etc/rc.d/S08lg6851f-pro-network-diag |
            grep -F '/etc/rc.d/S08lg6851f-pro-network-diag -> ../init.d/lg6851f-pro-network-diag'
          while IFS= read -r runtime; do
            unsquashfs -cat "$rootfs" "$runtime" | cmp - "files/$runtime"
          done < build-pro-wireless/network-runtime.txt
          unsquashfs -ll "$rootfs" etc/rc.d/S18turboacc | grep -F '/etc/rc.d/S18turboacc -> ../init.d/turboacc'
          unsquashfs -cat "$rootfs" lib/modules/6.18.44/nf_nat.ko > "$RUNNER_TEMP/pro-image-nf_nat.ko"
          readelf -SW "$RUNNER_TEMP/pro-image-nf_nat.ko" | grep -E ' __param +PROGBITS '
          readelf -p .rodata "$RUNNER_TEMP/pro-image-nf_nat.ko" | grep -E ' lg6851f_nat_mode$'
          if unsquashfs -ll "$rootfs" | grep -F '/etc/uci-defaults/zzzz-lg6851f-public-firstboot' >/dev/null; then
            echo 'Unexpected Pro first-boot password generator in the experimental rootfs'
            exit 1
          fi
          out=pro-image-verified
          mkdir -p "$out/a" "$out/b"
          cp 'A槽单刷boot和rootfs签名成功包/'{boot_a.img,rootfs_a.img,lg6851f-signed-boot-rootfs.manifest.json} "$out/a/"
          cp 'B槽单刷boot和rootfs签名成功包/'{boot_b.img,rootfs_b.img,lg6851f-signed-boot-rootfs.manifest.json} "$out/b/"
          for slot in a b; do
            package="bin/targets/mediatek/mt6990/lg6851f-mt6990-$slot-signed-sysupgrade.tar.gz"
            tar -xOzf "$package" CONTROL | grep -Fx "slot=$slot"
            cp "$package" "$out/$slot/"
          done
          cp "$dtb" "$out/"
          cp pro-wireless-verified/{build-id.txt,driver-repair.json} "$out/"

      - name: Verify and publish the matching experimental APK library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/mt6990-build-apk-repository.sh
          library=bin/mt6990-apk-repository
          shopt -s nullglob
          kdirs=(build_dir/target-*/linux-mediatek_mt6990)
          test "${#kdirs[@]}" -eq 1
          for name in build.json public-key.pem selection.json; do
            unsquashfs -cat "${kdirs[0]}/root.squashfs" "usr/share/mt6990-apk/$name" | cmp - "$library/$name"
          done
          unsquashfs -cat "${kdirs[0]}/root.squashfs" etc/apk/world | cmp - "$library/firmware.world"
          for slot in a b; do
            cp "$library/repository.manifest.json" "pro-image-verified/$slot/APK_LIBRARY.json"
          done
          (
            cd pro-image-verified
            sha256sum a/* b/* ./*.dtb build-id.txt driver-repair.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          python3 scripts/mt6990-publish-apk-library.py --branch firmware-apk-stock-accel-port

      - name: Upload wireless ABI build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-Pro-wireless-ABI-diagnostics
          include-hidden-files: true
          path: |
            .config
            defconfig.log
            build-pro-wireless/*.log
            bin/mt6990-apk-validation/
          retention-days: 7

      - name: Upload the experimental images
        uses: actions/upload-artifact@v4
        with:
          name: LG6851F-stock-accel-Pro-experimental-${{ github.run_id }}-${{ github.run_attempt }}
          path: pro-image-verified/
          if-no-files-found: error
          retention-days: 14
